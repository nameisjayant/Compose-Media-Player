name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Validates the wrapper jar and caches Gradle dependencies/build cache between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintBetaDebug lintProdDebug

      - name: Unit tests
        run: ./gradlew testBetaDebugUnitTest testProdDebugUnitTest

      - name: Build APKs
        run: ./gradlew assembleBetaDebug assembleProdRelease

      - name: Upload lint & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
