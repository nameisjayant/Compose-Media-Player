name: Release

# Push a tag like v1.2.0 to publish a GitHub Release with the prod and beta APKs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew testBetaDebugUnitTest testProdDebugUnitTest

      - name: Build release APKs
        run: ./gradlew assembleProdRelease assembleBetaRelease

      - name: Rename APKs with the tag
        run: |
          mkdir dist
          cp app/build/outputs/apk/prod/release/app-prod-release.apk "dist/AndroidPractice-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/beta/release/app-beta-release.apk "dist/AndroidPractice-${GITHUB_REF_NAME}-beta.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
